<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A-Stock Data · A股全市场数据看板</title>
<meta name="description" content="A股实时行情看板：大盘指数、涨跌分布、板块热力图、涨跌幅榜与个股K线。数据来自东方财富公开行情接口，纯前端实现。" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230a0e13'/><path d='M20 72 L40 48 L56 60 L80 26' stroke='%23ff4d4f' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none">
        <rect x="0.5" y="0.5" width="31" height="31" rx="9" stroke="rgba(245,196,81,.45)" />
        <path d="M7 23L13 16L18 19.5L25 9" stroke="#ff4d4f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="25" cy="9" r="2.2" fill="#f5c451" />
      </svg>
    </span>
    <div class="brand-txt">
      <h1>A-Stock Data</h1>
      <p>A 股全市场实时数据看板</p>
    </div>
  </div>

  <div class="topbar-right">
    <div class="search">
      <svg viewBox="0 0 24 24" class="ic"><path d="M10.5 3a7.5 7.5 0 105.9 12.1l4.3 4.3 1.4-1.4-4.3-4.3A7.5 7.5 0 0010.5 3zm0 2a5.5 5.5 0 110 11 5.5 5.5 0 010-11z"/></svg>
      <input id="searchInput" type="text" placeholder="搜索代码 / 名称，回车打开个股" autocomplete="off" spellcheck="false" />
      <div class="search-drop" id="searchDrop"></div>
    </div>
    <div class="status" id="status"><i class="dot"></i><span id="statusText">连接中</span></div>
    <button class="icon-btn" id="refreshBtn" title="立即刷新">
      <svg viewBox="0 0 24 24" class="ic"><path d="M12 4a8 8 0 016.9 4H16v2h5.5V4.5h-2v2.2A9.9 9.9 0 0012 2a10 10 0 100 20 10 10 0 009.5-6.9l-1.9-.6A8 8 0 1112 4z"/></svg>
    </button>
    <label class="switch" title="每 30 秒自动刷新">
      <input type="checkbox" id="autoRefresh" checked />
      <span class="track"><span class="knob"></span></span>
      <em>自动</em>
    </label>
  </div>
</header>

<main>

  <section class="indices" id="indices" aria-label="大盘指数"></section>

  <div class="grid g-hero">
    <section class="card">
      <div class="card-head">
        <h2>市场宽度</h2>
        <span class="tag" id="breadthMeta">沪深 A 股 · 全市场扫描</span>
      </div>
      <div class="breadth">
        <div class="breadth-nums">
          <div class="bnum up"><b id="upCount">–</b><span>上涨</span></div>
          <div class="bnum flat"><b id="flatCount">–</b><span>平盘</span></div>
          <div class="bnum down"><b id="downCount">–</b><span>下跌</span></div>
        </div>
        <div class="ratio-bar">
          <i class="seg up" id="segUp"></i><i class="seg flat" id="segFlat"></i><i class="seg down" id="segDown"></i>
        </div>
        <div class="mini-stats">
          <div><span>涨停</span><b class="up" id="limitUp">–</b></div>
          <div><span>跌停</span><b class="down" id="limitDown">–</b></div>
          <div><span>成交额</span><b id="totalAmount">–</b></div>
          <div><span>平均涨跌</span><b id="avgPct">–</b></div>
        </div>
      </div>
      <canvas id="distChart" height="150" aria-label="涨跌幅分布"></canvas>
      <div class="scan-tip" id="scanTip">正在扫描全市场行情…</div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>板块热力图</h2>
        <span class="tag">按成交额权重 · 颜色为涨跌幅</span>
      </div>
      <div class="heatmap" id="heatmap"></div>
      <div class="heat-legend">
        <span>跌</span><i class="grad"></i><span>涨</span>
      </div>
    </section>
  </div>

  <div class="grid g-three">
    <section class="card">
      <div class="card-head"><h2>涨幅榜</h2><span class="tag">TOP 15</span></div>
      <div class="table-wrap"><table class="rank-table" id="gainersTable"></table></div>
    </section>
    <section class="card">
      <div class="card-head"><h2>跌幅榜</h2><span class="tag">TOP 15</span></div>
      <div class="table-wrap"><table class="rank-table" id="losersTable"></table></div>
    </section>
    <section class="card">
      <div class="card-head"><h2>自选股</h2><button class="ghost-btn" id="clearWatch">清空</button></div>
      <div class="table-wrap"><table class="rank-table" id="watchTable"></table></div>
      <div class="empty" id="watchEmpty">点击任意个股打开详情，右上角「＋ 自选」即可收藏，本地保存。</div>
    </section>
  </div>

  <footer class="foot">
    <span>数据来源：东方财富公开行情接口 · 纯前端静态页，不经过第三方服务器</span>
    <span>本页仅用于数据分析学习，不构成任何投资建议</span>
  </footer>
</main>

<!-- 个股详情抽屉 -->
<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div class="d-title">
      <h3><span id="dName">—</span><em id="dCode"></em></h3>
      <div class="d-price"><b id="dPrice">—</b><span id="dChg">—</span></div>
    </div>
    <div class="d-actions">
      <button class="ghost-btn" id="watchBtn">＋ 自选</button>
      <button class="icon-btn" id="closeDrawer" title="关闭">
        <svg viewBox="0 0 24 24" class="ic"><path d="M18.3 5.7L12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7l1.4-1.4L10.6 10.6l6.3-6.3z"/></svg>
      </button>
    </div>
  </div>
  <div class="d-stats" id="dStats"></div>
  <div class="d-chartbar">
    <div class="segs" id="kltSegs">
      <button data-klt="101" class="on">日K</button>
      <button data-klt="102">周K</button>
      <button data-klt="103">月K</button>
    </div>
    <span class="d-legend"><i class="ma5"></i>MA5<i class="ma10"></i>MA10<i class="ma20"></i>MA20</span>
  </div>
  <div class="d-chartbox">
    <canvas id="klineCanvas"></canvas>
    <div class="k-tip" id="kTip"></div>
  </div>
  <div class="d-foot" id="dFoot"></div>
</aside>

<div class="toast" id="toast"></div>

<script src="assets/api.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
